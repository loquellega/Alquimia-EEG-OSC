name: Compilar ejecutables

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archivo: AlquimiaEEGOSC-windows.exe
            sep: ";"
          - os: macos-latest
            archivo: AlquimiaEEGOSC-mac.zip
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Compilar
        run: pyinstaller --onefile --name AlquimiaEEGOSC --add-data "monitor.html${{ matrix.sep }}." --add-data "frases.json${{ matrix.sep }}." --collect-submodules websockets --noconfirm cortex_osc.py

      - name: Prueba rápida (simulación)
        shell: bash
        run: |
          if [ -f dist/AlquimiaEEGOSC.exe ]; then EXE=dist/AlquimiaEEGOSC.exe; else EXE=dist/AlquimiaEEGOSC; fi
          "$EXE" --simular --no-abrir --monitor > prueba.log 2>&1 &
          # el ejecutable de un solo archivo se descomprime al arrancar: en máquinas lentas tarda
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9201 | grep -q "monitor de contacto"; then echo "arrancó en ${i}x2 s"; cat prueba.log; exit 0; fi
            sleep 2
          done
          cat prueba.log; exit 1

      - name: Empaquetar
        shell: bash
        run: |
          if [ -f dist/AlquimiaEEGOSC.exe ]; then
            mv dist/AlquimiaEEGOSC.exe "dist/${{ matrix.archivo }}"
          else
            cp frases.json dist/ && cd dist && zip -9 "${{ matrix.archivo }}" AlquimiaEEGOSC frases.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archivo }}
          path: dist/${{ matrix.archivo }}

      - name: Adjuntar a la versión publicada
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/${{ matrix.archivo }}" --clobber
